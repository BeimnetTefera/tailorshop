{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F3F3F3">
  <title>{% block title %}Home{% endblock %} · Tailor shop</title>
  <script>
    // Pick light or dark before the page paints: saved choice first, then the device setting.
    (function () {
      var theme;
      try { theme = localStorage.getItem("theme"); } catch (e) {}
      if (theme !== "light" && theme !== "dark") {
        theme = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", theme);
      document.querySelector('meta[name="theme-color"]').content = theme === "dark" ? "#121413" : "#F3F3F3";
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'shop/css/app.css' %}">
</head>
<body>
  {% if messages %}
  <div class="toasts" role="status">
    {% for m in messages %}<div class="toast toast-{{ m.tags }}">{{ m }}</div>{% endfor %}
  </div>
  {% endif %}
  <main class="app {% block app_class %}{% endblock %}">
    {% block content %}{% endblock %}
  </main>
  {% block nav %}{% include "shop/partials/nav.html" %}{% endblock %}
  <script src="{% static 'shop/js/app.js' %}" defer></script>
</body>
</html>
