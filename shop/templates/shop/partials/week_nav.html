{% load shop_extras %}
<div class="week-nav">
  <a class="icon-btn" href="?week={{ week.prev }}" aria-label="Previous week">{% icon "chev-left" %}</a>
  <span>{{ week.label }}{% if week.is_current %} · this week{% endif %}</span>
  <a class="icon-btn" href="?week={{ week.next }}" aria-label="Next week">{% icon "chev-right" %}</a>
</div>
